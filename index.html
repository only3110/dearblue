<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Klik di mana saja untuk pindah ke kalimat berikutnya -->
  <main class="intro" id="intro">
    <div class="intro__content">
      <p class="intro__text">
        <span class="intro__ghost" id="ghost"></span>
        <span class="intro__typed"><span id="text"></span><span class="intro__caret" id="caret"></span></span>
      </p>

      <!-- Teks di bawah kalimat utama: ubah/tambah langsung di sini -->
      <p class="intro__sub">- klik -</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
